<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daddy Birthday</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#071a33;
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}

button,
input{
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =====================================================
   GLOBAL ANIMATIONS
===================================================== */

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes softFade{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes floatUp{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-12px);
  }
}

@keyframes balloonFloat{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }
  50%{
    transform:translateY(-22px) rotate(3deg);
  }
}

@keyframes flowerGrow{
  0%{
    transform:scale(0) rotate(-20deg);
    opacity:0;
  }
  70%{
    transform:scale(1.08) rotate(4deg);
    opacity:1;
  }
  100%{
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

@keyframes stemGrow{
  from{
    height:0;
  }
  to{
    height:115px;
  }
}

@keyframes glow{
  0%,100%{
    box-shadow:0 0 10px rgba(180,220,255,.35);
  }
  50%{
    box-shadow:0 0 28px rgba(180,220,255,.8);
  }
}

@keyframes flame{
  0%,100%{
    transform:scaleY(1) rotate(-2deg);
  }
  50%{
    transform:scaleY(1.18) rotate(3deg);
  }
}

@keyframes smoke{
  0%{
    opacity:.8;
    transform:translateY(0) scale(.8);
  }
  100%{
    opacity:0;
    transform:translateY(-35px) scale(1.5);
  }
}

@keyframes letterAppear{
  from{
    opacity:0;
    transform:translateY(35px) rotate(1deg);
  }
  to{
    opacity:1;
    transform:translateY(0) rotate(0);
  }
}

@keyframes infinityPulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.08);
  }
}


/* =====================================================
   MAIN OPENING
===================================================== */

#opening{
  min-height:100vh;
}

.opening-screen{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 30%,#173b72 0%,#0b2548 42%,#04101f 100%);
  color:white;
  text-align:center;
  padding:35px 20px 70px;
}

.opening-stars{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.opening-stars span{
  position:absolute;
  width:3px;
  height:3px;
  background:rgba(255,255,255,.7);
  border-radius:50%;
  animation:softFade 3s infinite alternate;
}

.opening-content{
  position:relative;
  z-index:10;
  max-width:430px;
  margin:auto;
  padding-top:55px;
  animation:fadeIn 1.2s ease;
}

.opening-small{
  font-size:13px;
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:.72;
  margin-bottom:18px;
}

.opening-title{
  font-size:34px;
  line-height:1.2;
  margin:0;
  font-weight:bold;
}

.opening-subtitle{
  font-size:16px;
  opacity:.82;
  margin:18px 0 28px;
}

.infinity-opening{
  font-size:68px;
  margin:10px 0 22px;
  color:#dcefff;
  animation:infinityPulse 2.4s ease-in-out infinite;
}

.for-daddy{
  font-size:22px;
  letter-spacing:1px;
  margin-bottom:28px;
}

.password-box{
  width:100%;
  max-width:280px;
  margin:auto;
}

.password-box input{
  width:100%;
  padding:15px 18px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:30px;
  background:rgba(255,255,255,.1);
  color:white;
  text-align:center;
  font-size:16px;
  outline:none;
  backdrop-filter:blur(8px);
}

.password-box input::placeholder{
  color:rgba(255,255,255,.7);
}

.unlock-button{
  margin-top:15px;
  border:none;
  border-radius:30px;
  padding:14px 32px;
  background:white;
  color:#071a33;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
  transition:.25s;
}

.unlock-button:active{
  transform:scale(.95);
}


/* =====================================================
   FLOWER GARDEN
===================================================== */

.flower-garden{
  position:absolute;
  left:0;
  right:0;
  bottom:-5px;
  height:190px;
  pointer-events:none;
}

.flower{
  position:absolute;
  bottom:20px;
  width:100px;
  height:155px;
  transform-origin:bottom center;
  opacity:0;
  animation:flowerGrow .9s ease forwards;
}

.flower:nth-child(1){left:2%;animation-delay:.2s;}
.flower:nth-child(2){left:18%;animation-delay:.45s;transform:scale(.8);}
.flower:nth-child(3){left:36%;animation-delay:.7s;transform:scale(.9);}
.flower:nth-child(4){left:55%;animation-delay:.95s;transform:scale(.75);}
.flower:nth-child(5){left:72%;animation-delay:1.2s;transform:scale(.9);}
.flower:nth-child(6){left:88%;animation-delay:1.45s;transform:scale(.78);}

.flower-head{
  position:absolute;
  left:50%;
  top:5px;
  width:58px;
  height:58px;
  transform:translateX(-50%);
}

.petal{
  position:absolute;
  width:29px;
  height:40px;
  border-radius:50% 50% 45% 45%;
  left:15px;
  top:8px;
  transform-origin:50% 85%;
}

.petal:nth-child(1){
  transform:rotate(0deg) translateY(-16px);
}

.petal:nth-child(2){
  transform:rotate(60deg) translateY(-16px);
}

.petal:nth-child(3){
  transform:rotate(120deg) translateY(-16px);
}

.petal:nth-child(4){
  transform:rotate(180deg) translateY(-16px);
}

.petal:nth-child(5){
  transform:rotate(240deg) translateY(-16px);
}

.petal:nth-child(6){
  transform:rotate(300deg) translateY(-16px);
}

.flower.white .petal{
  background:linear-gradient(145deg,#ffffff,#dcefff);
  box-shadow:
    inset 0 -4px 7px rgba(90,145,190,.18),
    0 3px 9px rgba(0,0,0,.15);
}

.flower.blue .petal{
  background:linear-gradient(145deg,#ffffff,#a9d9ff);
  box-shadow:
    inset 0 -5px 8px rgba(50,130,190,.2),
    0 3px 9px rgba(0,0,0,.15);
}

.flower-center{
  position:absolute;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#d8b76a;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 7px rgba(255,220,130,.7);
  z-index:3;
}

.flower-stem{
  position:absolute;
  width:5px;
  height:115px;
  background:linear-gradient(to right,#315f49,#7aa77e,#315f49);
  left:50%;
  top:53px;
  transform:translateX(-50%);
  border-radius:5px;
}

.leaf{
  position:absolute;
  width:30px;
  height:14px;
  background:linear-gradient(135deg,#426e56,#9abf9b);
  border-radius:100% 0 100% 0;
  top:105px;
}

.leaf.left{
  left:18px;
  transform:rotate(-25deg);
}

.leaf.right{
  right:18px;
  transform:scaleX(-1) rotate(-25deg);
}


/* =====================================================
   SIMPLE PAGE SCREENS
===================================================== */

.simple-screen{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 20%,#173b72,#071a33 65%);

}

}

}

  font-size:17px;
  line-height:1.8;

}

.primary-button{
  border:none;
  background:white;
  color:#071a33;
  padding:15px 28px;
  border-radius:30px;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
  margin-top:20px;
}

.round-infinity{
  border:none;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#071a33;
  color:white;
  font-size:34px;
  box-shadow:0 8px 22px rgba(0,0,0,.3);
  animation:infinityPulse 2s infinite;
}

/* =====================================================

   LOVE LETTER INSIDE MEMORY

===================================================== */

.love-letter{

  display:none;

  margin-top:25px;

  background:#fffdf7;

  color:#263238;

  padding:30px 24px;

  border-radius:5px;

  text-align:left;

  line-height:1.8;

  font-size:16px;

  box-shadow:0 12px 35px rgba(0,0,0,.35);

  animation:letterAppear .8s ease;

  position:relative;

}

.love-letter:before,

.love-letter:after{

  content:"";

  position:absolute;

  width:32px;

  height:25px;

  border-radius:50% 45% 50% 45%;

  background:#b85a72;

  opacity:.65;

}

.love-letter:before{

  left:10px;

  top:10px;

  transform:rotate(-25deg);

}

.love-letter:after{

  right:10px;

  bottom:10px;

  transform:rotate(25deg);

}

.love-letter p{

  margin:17px 0;

}

.love-letter-ending{

  text-align:center;

  font-size:38px;

  color:#244b88;

  margin:25px 0;

}

}
