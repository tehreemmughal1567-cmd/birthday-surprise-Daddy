<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daddy Birthday</title>

<style>
*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#071a33;
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}

button,input{
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

button{cursor:pointer}

.hidden{display:none!important}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-22px) rotate(3deg)}
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

@keyframes flame{
  0%,100%{transform:scaleY(1) rotate(-3deg)}
  50%{transform:scaleY(1.2) rotate(4deg)}
}

@keyframes smoke{
  from{opacity:.8;transform:translateY(0) scale(.7)}
  to{opacity:0;transform:translateY(-40px) scale(1.5)}
}

@keyframes flowerOpen{
  0%{opacity:0;transform:scale(0) rotate(-20deg)}
  70%{opacity:1;transform:scale(1.08) rotate(5deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}

@keyframes paperIn{
  from{opacity:0;transform:translateY(35px) rotate(1deg)}
  to{opacity:1;transform:translateY(0) rotate(0)}
}

@keyframes sparkle{
  0%,100%{opacity:.3;transform:scale(.7)}
  50%{opacity:1;transform:scale(1)}
}

/* ================= OPENING ================= */

#opening{
  min-height:100vh;
}

.opening-screen{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,#244e89 0%,#0b294f 42%,#03101e 100%);
  color:white;
  text-align:center;
  padding:35px 20px 230px;
}

.opening-content{
  position:relative;
  z-index:10;
  max-width:430px;
  margin:auto;
  padding-top:45px;
  animation:fadeIn 1.2s ease;
}

.opening-small{
  font-size:12px;
  letter-spacing:5px;
  text-transform:uppercase;
  opacity:.7;
}

.opening-title{
  font-size:35px;
  line-height:1.2;
  margin:18px 0 10px;
}

.opening-subtitle{
  font-size:16px;
  opacity:.8;
  line-height:1.6;
}

.infinity-opening{
  font-size:72px;
  color:#dff3ff;
  margin:20px 0;
  animation:pulse 2.4s infinite;
}

.for-daddy{
  font-size:23px;
  letter-spacing:2px;
  margin-bottom:28px;
}

.password-box{
  max-width:285px;
  margin:auto;
}

.password-box input{
  width:100%;
  padding:15px 18px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:30px;
  background:rgba(255,255,255,.1);
  color:white;
  text-align:center;
  outline:none;
  font-size:16px;
  backdrop-filter:blur(10px);
}

.password-box input::placeholder{
  color:rgba(255,255,255,.7);
}

.unlock-button,
.primary-button{
  border:0;
  border-radius:30px;
  padding:14px 30px;
  background:white;
  color:#071a33;
  font-size:16px;
  font-weight:bold;
  margin-top:15px;
  box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.opening-stars{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.opening-stars span{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation:sparkle 2s infinite;
}

/* ================= FLOWERS ================= */

.flower-garden{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:220px;
  pointer-events:none;
}

.flower{
  position:absolute;
  bottom:20px;
  width:95px;
  height:175px;
  opacity:0;
  animation:flowerOpen 1s ease forwards;
}

.flower:nth-child(1){left:0;animation-delay:.2s}
.flower:nth-child(2){left:14%;transform:scale(.8);animation-delay:.5s}
.flower:nth-child(3){left:30%;animation-delay:.8s}
.flower:nth-child(4){left:48%;transform:scale(.75);animation-delay:1.1s}
.flower:nth-child(5){left:65%;transform:scale(.9);animation-delay:1.4s}
.flower:nth-child(6){left:82%;transform:scale(.78);animation-delay:1.7s}

.flower-head{
  position:absolute;
  top:0;
  left:50%;
  width:62px;
  height:62px;
  transform:translateX(-50%);
}

.petal{
  position:absolute;
  width:30px;
  height:42px;
  left:16px;
  top:8px;
  border-radius:50% 50% 45% 45%;
  transform-origin:50% 85%;
}

.petal:nth-child(1){transform:rotate(0) translateY(-17px)}
.petal:nth-child(2){transform:rotate(60deg) translateY(-17px)}
.petal:nth-child(3){transform:rotate(120deg) translateY(-17px)}
.petal:nth-child(4){transform:rotate(180deg) translateY(-17px)}
.petal:nth-child(5){transform:rotate(240deg) translateY(-17px)}
.petal:nth-child(6){transform:rotate(300deg) translateY(-17px)}

.flower.white .petal{
  background:linear-gradient(145deg,#fff,#dceeff);
  box-shadow:inset 0 -5px 8px rgba(60,120,170,.15),0 4px 10px rgba(0,0,0,.2);
}

.flower.blue .petal{
  background:linear-gradient(145deg,#fff,#9ed5fa);
  box-shadow:inset 0 -5px 8px rgba(40,120,180,.2),0 4px 10px rgba(0,0,0,.2);
}

.flower-center{
  position:absolute;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#d8b76a;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:5;
}

.flower-stem{
  position:absolute;
  width:5px;
  height:125px;
  left:50%;
  top:55px;
  transform:translateX(-50%);
  border-radius:5px;
  background:linear-gradient(to right,#315e45,#87ad7e,#315e45);
}

.leaf{
  position:absolute;
  width:31px;
  height:15px;
  top:112px;
  background:linear-gradient(135deg,#426d52,#9abc95);
  border-radius:100% 0 100% 0;
}

.leaf.left{
  left:12px;
  transform:rotate(-25deg);
}

.leaf.right{
  right:12px;
  transform:scaleX(-1) rotate(-25deg);
}

/* ================= SIMPLE SCREENS ================= */

.simple-screen{
  min-height:100vh;
  background:radial-gradient(circle at 50% 20%,#244e89,#071a33 70%);
  color:white;
  text-align:center;
  padding:60px 20px;
  animation:fadeIn .8s ease;
}

.simple-inner{
  max-width:430px;
  margin:auto;
  padding-top:70px;
}

.simple-inner h1{
  font-size:34px;
}

.simple-inner p{
  font-size:17px;
  line-height:1.8;
}

.round-infinity,
.next-button{
  border:0;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#071a33;
  color:white;
  font-size:35px;
  margin-top:30px;
  animation:pulse 2s infinite;
}

/* ================= MEMORIES ================= */

.memory-screen{
  min-height:100vh;
  background:linear-gradient(180deg,#071a33,#10416e,#071a33);
  color:white;
  text-align:center;
  padding:45px 15px 70px;
  animation:fadeIn .8s ease;
}

.memory-screen h1{
  font-size:31px;
}

.memory-intro{
  opacity:.8;
  line-height:1.6;
}

.memory-heart{
  position:relative;
  width:320px;
  height:330px;
  max-width:100%;
  margin:30px auto;
}

.memoryPhoto{
  position:absolute;
  width:90px;
  height:90px;
  border-radius:18px;
  overflow:hidden;
  background:#29496b;
  filter:blur(7px);
  transition:.6s;
  border:2px solid rgba(255,255,255,.6);
  box-shadow:0 8px 20px rgba(0,0,0,.4);
}

.memoryPhoto img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.memoryPhoto.revealed{
  filter:blur(0);
  transform:scale(1.06);
}

.memory-message{
  max-width:320px;
  min-height:75px;
  margin:20px auto 45px;
  font-size:17px;
  line-height:1.7;
}

.letter-section{
  max-width:380px;
  margin:50px auto;
}

.infinity-card{
  background:#f7f1e3;
  color:#263238;
  padding:35px 25px;
  border-radius:8px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.infinity-card-button{
  border:0;
  background:none;
  font-size:70px;
  color:#244b88;
  animation:pulse 2s infinite;
}

/* ================= LOVE LETTER ================= */

.love-letter{
  display:none;
  position:relative;
  margin-top:25px;
  padding:42px 27px;
  background:
    linear-gradient(90deg,rgba(180,150,100,.06) 1px,transparent 1px),
    #fffdf7;
  background-size:25px 25px;
  color:#263238;
  text-align:left;
  line-height:1.8;
  font-size:16px;
  border:1px solid #d8c7a8;
  border-radius:4px;
  box-shadow:0 18px 45px rgba(0,0,0,.35);
  animation:paperIn .9s ease;
}

.love-letter:before,
.love-letter:after{
  content:"";
  position:absolute;
  width:42px;
  height:25px;
  border-radius:60% 40% 55% 45%;
  background:linear-gradient(135deg,#b94e70,#e58ba0);
  opacity:.65;
}

.love-letter:before{
  top:14px;
  left:12px;
  transform:rotate(-20deg);
}

.love-letter:after{
  right:12px;
  bottom:14px;
  transform:rotate(20deg);
}

.love-letter p{
  margin:17px 0;
}

.next-letter-button{
  text-align:center;
  margin-top:25px;
}

.next-letter-button button{
  border:0;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#071a33;
  color:white;
  font-size:32px;
}

/* ================= CHILDHOOD ================= */

.childhood-screen{
  min-height:100vh;
  background:radial-gradient(circle at 50% 10%,#fff,#eaf6ff 45%,#b9dcf7);
  color:#071a33;
  text-align:center;
  padding:45px 20px 70px;
  animation:fadeIn .8s ease;
}

.childhood-inner{
  max-width:400px;
  margin:auto;
}

.childhood-title{
  font-size:30px;
}

.childhood-photo{
  background:#fffdf7;
  padding:12px;
  max-width:300px;
  margin:30px auto;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,45,90,.2);
}

.childhood-photo img{
  width:100%;
  display:block;
  border-radius:13px;
}

.childhood-text{
  background:rgba(255,255,255,.9);
  padding:22px 18px;
  border-radius:18px;
  font-size:17px;
  line-height:1.7;
  box-shadow:0 8px 25px rgba(0,45,90,.12);
}

/* ================= BALLOONS ================= */

.balloon-area{
  position:relative;
  height:190px;
  margin-bottom:5px;
}

.balloon{
  position:absolute;
  width:70px;
  height:92px;
  border-radius:50% 50% 47% 47%;
  animation:float 4s ease-in-out infinite;
  box-shadow:inset -10px -12px 20px rgba(0,70,130,.12),0 8px 20px rgba(0,50,100,.12);
}

.balloon:before{
  content:"";
  position:absolute;
  width:9px;
  height:8px;
  bottom:-5px;
  left:50%;
  transform:translateX(-50%) rotate(45deg);
  background:inherit;
}

.balloon:after{
  content:"";
  position:absolute;
  top:13px;
  left:15px;
  width:13px;
  height:27px;
  border-radius:50%;
  background:rgba(255,255,255,.65);
  transform:rotate(25deg);
}

.balloon.white{
  background:linear-gradient(135deg,#fff,#dcefff);
}

.balloon.blue{
  background:linear-gradient(135deg,#d8f0ff,#76b8ea);
}

.balloon:nth-child(1){left:3%;top:35px}
.balloon:nth-child(2){left:25%;top:5px;width:58px;height:78px;animation-delay:.8s}
.balloon:nth-child(3){right:24%;top:18px;width:65px;height:87px;animation-delay:1.3s}
.balloon:nth-child(4){right:2%;top:42px;width:75px;height:98px;animation-delay:1.8s}

.string{
  position:absolute;
  width:1px;
  height:75px;
  background:rgba(40,80,110,.55);
  left:50%;
  top:95%;
}

/* ================= CAKE ================= */

.cake-screen{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  background:radial-gradient(circle at 50% 15%,#fff,#eaf6ff 50%,#c5e3f9);
  color:#071a33;
  text-align:center;
  padding:25px 15px 70px;
  animation:fadeIn .8s ease;
}

.cake-screen h1{
  font-size:32px;
  margin:10px 0;
}

.cake-screen p{
  font-size:16px;
  line-height:1.6;
}

.cake{
  position:relative;
  width:270px;
  height:230px;
  margin:15px auto 20px;
}

.cake-layer{
  position:absolute;
  left:20px;
  width:230px;
  height:55px;
  border-radius:12px 12px 16px 16px;
  background:linear-gradient(#fff,#e8f5ff);
  border:2px solid #c4e2f7;
  box-shadow:0 10px 15px rgba(0,70,130,.15);
}

.cake-layer.one{bottom:15px}
.cake-layer.two{bottom:65px;left:35px;width:200px}
.cake-layer.three{bottom:115px;left:52px;width:166px}

.cake-top{
  position:absolute;
  left:52px;
  bottom:150px;
  width:166px;
  height:38px;
  border-radius:50%;
  background:#fff;
  border:2px solid #c4e2f7;
}

.drip{
  position:absolute;
  top:25px;
  width:20px;
  height:25px;
  background:#9bd3f5;
  border-radius:0 0 15px 15px;
}

.drip:nth-child(1){left:20px}
.drip:nth-child(2){left:65px;height:34px}
.drip:nth-child(3){right:25px;height:29px}

.candle{
  position:absolute;
  bottom:150px;
  width:13px;
  height:48px;
  border-radius:4px;
  background:repeating-linear-gradient(135deg,#8ec8ee 0 5px,#fff 5px 10px);
  z-index:5;
  cursor:pointer;
}

.candle:nth-child(1){left:83px}
.candle:nth-child(2){left:128px}
.candle:nth-child(3){right:83px}

.flame{
  position:absolute;
  width:15px;
  height:23px;
  left:50%;
  top:-24px;
  transform:translateX(-50%);
  border-radius:50% 50% 50% 50%;
  background:radial-gradient(circle at 50% 70%,#fff 0 20%,#ffd86b 35%,#ff9c42 65%,transparent 70%);
  animation:flame .7s infinite;
}

.candle.off .flame{
  display:none;
}

.candle.off:after{
  content:"";
  position:absolute;
  width:8px;
  height:18px;
  left:3px;
  top:-18px;
  border-radius:50%;
  background:#b8c2c8;
  animation:smoke 1.4s ease-out forwards;
}

.cake-choices{
  max-width:360px;
  margin:15px auto;
}

.cake-choice{
  border:1px solid #9dcbe9;
  background:rgba(255,255,255,.8);
  color:#071a33;
  padding:10px 15px;
  margin:4px;
  border-radius:20px;
  font-size:14px;
}

.cake-choice.selected{
  background:#071a33;
  color:white;
}

.cakeMessage{
  display:none;
  max-width:340px;
  margin:25px auto;
  padding:20px;
  background:rgba(255,255,255,.8);
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,50,100,.15);
}

.cake-next{
  display:none;
}

/* ================= FINAL PAGE ================= */

#finalPage{
  display:none;
}

.final-page{
  min-height:100vh;
  background:linear-gradient(180deg,#0a2342,#123f6b,#071a33);
  color:white;
  padding:45px 18px 80px;
  text-align:center;
}

.final-paper{
  max-width:420px;
  margin:auto;
  position:relative;
  padding:45px 27px;
  background:
    linear-gradient(90deg,rgba(180,150,100,.06) 1px,transparent 1px),
    #fffdf7;
  background-size:25px 25px;
  color:#263238;
  text-align:left;
  line-height:1.8;
  font-size:16px;
  border:1px solid #d8c7a8;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  animation:paperIn 1s ease;
}

.final-paper:before,
.final-paper:after{
  content:"";
  position:absolute;
  width:44px;
  height:27px;
  border-radius:60% 40% 55% 45%;
  background:linear-gradient(135deg,#b94e70,#e58ba0);
  opacity:.65;
}

.final-paper:before{
  left:12px;
  top:14px;
  transform:rotate(-20deg);
}

.final-paper:after{
  right:12px;
  bottom:14px;
  transform:rotate(20deg);
}

.final-paper h1{
  text-align:center;
  color:#244b88;
  font-size:28px;
  line-height:1.3;
  margin-bottom:30px;
}

.final-paper p{
  margin:17px 0;
}

.special,
.quote,
.promise,
.together,
.forever,
.ending,
.love{
  text-align:center;
}

.special{
  color:#244b88;
  font-size:21px;
  font-weight:bold;
}

.quote{
  font-style:italic;
  font-size:19px;
}

.promise{
  font-size:22px;
  color:#244b88;
  font-weight:bold;
}

.together{
  font-size:21px;
  color:#244b88;
}

.forever{
  font-size:22px;
  color:#244b88;
  font-weight:bold;
}

.ending{
  font-size:17px;
}

.love{
  font-size:20px;
  color:#244b88;
  font-weight:bold;
}

.final-signature{
  text-align:center;
  margin-top:35px;
}

.big-infinity{
  border:0;
  width:80px;
  height:80px;
  border-radius:50%;
  background:#071a33;
  color:white;
  font-size:42px;
  animation:pulse 2s infinite;
}

.alm,
.birthday{
  display:none;
}

.alm{
  margin-top:30px;
  font-size:42px;
  font-weight:bold;
  color:#244b88;
}

.alm span{
  color:#b94e70;
}

.birthday{
  margin-top:12px;
  font-size:23px;
  color:#244b88;
  font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:380px){
  .opening-title{font-size:31px}
  .memory-heart{transform:scale(.9);margin-left:-5%;margin-right:-5%}
  .cake{transform:scale(.9);margin-left:-5%;margin-right:-5%}
}
</style>
</head>

<body>

<div id="opening"></div>

<div id="finalPage"></div>

function selectCake(type,button){

  selectedCake = type;

  document.querySelectorAll(".cake-choice")
    .forEach(btn=>btn.classList.remove("selected"));

  button.classList.add("selected");

  const cake = document.getElementById("cake");

  if(type === "heart"){
    cake.style.transform = "scale(1.05)";
    cake.style.filter = "drop-shadow(0 12px 15px rgba(80,140,190,.25))";
  }

  if(type === "blue"){
    cake.style.transform = "scale(1.08)";
    cake.style.filter = "drop-shadow(0 12px 20px rgba(50,130,200,.3))";
  }

  if(type === "classic"){
    cake.style.transform = "scale(1)";
    cake.style.filter = "none";
  }
}

function blowCandle(candle){

  if(candle.classList.contains("off")) return;

  candle.classList.add("off");

  const candles =
    document.querySelectorAll(".candle");

  const allOff =
    [...candles].every(c =>
      c.classList.contains("off")
    );

  if(allOff){

    document.getElementById("cakeMessage").style.display =
      "block";

    setTimeout(()=>{
      document.getElementById("cakeMessage")
        .scrollIntoView({
          behavior:"smooth",
          block:"center"
        });
    },300);
  }
}
