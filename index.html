<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Daddy</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Cormorant Garamond",serif;
    background:#071a45;
    color:white;
    overflow-x:hidden;
}

.screen{
    display:none;
    min-height:100vh;
    width:100%;
    position:relative;
    overflow:hidden;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.screen.active{
    display:flex;
    animation:screenIn .8s ease both;
}

@keyframes screenIn{
    from{opacity:0;transform:scale(.98)}
    to{opacity:1;transform:scale(1)}
}

/* =========================
   GENERAL
========================= */

.center{
    width:100%;
    max-width:900px;
    text-align:center;
    position:relative;
    z-index:5;
}

.script{
    font-family:"Dancing Script",cursive;
}

.small{
    font-size:18px;
    opacity:.85;
}

button{
    border:0;
    cursor:pointer;
    font-family:"Cormorant Garamond",serif;
    -webkit-tap-highlight-color:transparent;
}

.primary-btn{
    margin-top:25px;
    padding:14px 35px;
    border-radius:50px;
    background:#dcecff;
    color:#092052;
    font-size:20px;
    font-weight:600;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    transition:.25s;
}

.primary-btn:active{
    transform:scale(.94);
}

.hidden{
    display:none !important;
}

/* =========================
   BLUE BACKGROUND
========================= */

.blue-bg{
    background:
      radial-gradient(circle at 20% 15%,rgba(90,160,255,.22),transparent 25%),
      radial-gradient(circle at 80% 80%,rgba(130,190,255,.16),transparent 28%),
      linear-gradient(145deg,#04143c,#092866,#06183e);
}

/* =========================
   BOWS
========================= */

.bow{
    position:absolute;
    width:76px;
    height:55px;
    z-index:1;
    opacity:.88;
    filter:drop-shadow(0 7px 10px rgba(0,0,0,.18));
    animation:bowFloat 4s ease-in-out infinite;
}

.bow:before,
.bow:after{
    content:"";
    position:absolute;
    top:9px;
    width:38px;
    height:40px;
    border-radius:55% 45% 55% 45%;
    background:linear-gradient(145deg,#b9ddff,#5f9ce8);
}

.bow:before{
    left:1px;
    transform:rotate(18deg);
}

.bow:after{
    right:1px;
    transform:rotate(-18deg);
}

.bow .knot{
    position:absolute;
    width:25px;
    height:25px;
    border-radius:50%;
    background:#76afea;
    left:25px;
    top:15px;
    z-index:2;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.bow .tail1,
.bow .tail2{
    position:absolute;
    top:33px;
    width:27px;
    height:34px;
    background:#7fb7f1;
    z-index:-1;
}

.bow .tail1{
    left:14px;
    transform:rotate(20deg);
    clip-path:polygon(0 0,100% 10%,70% 100%,35% 72%);
}

.bow .tail2{
    right:14px;
    transform:rotate(-20deg);
    clip-path:polygon(0 10%,100% 0,65% 72%,30% 100%);
}

.bow1{
    top:8%;
    left:8%;
    transform:rotate(-15deg) scale(1.05);
}

.bow2{
    top:19%;
    right:7%;
    transform:rotate(13deg) scale(.72);
    animation-delay:1s;
}

.bow3{
    bottom:9%;
    left:12%;
    transform:rotate(10deg) scale(.65);
    animation-delay:2s;
}

@keyframes bowFloat{
    0%,100%{translate:0 0}
    50%{translate:0 -8px}
}

/* =========================
   START SCREEN
========================= */

#startScreen{
    background:
      radial-gradient(circle at 50% 45%,rgba(55,120,220,.24),transparent 35%),
      linear-gradient(145deg,#03133a,#082967,#04183f);
}

.start-title{
    font-size:clamp(38px,8vw,70px);
    line-height:1.05;
    font-family:"Dancing Script",cursive;
    font-weight:600;
    text-shadow:0 5px 20px rgba(0,0,0,.2);
}

.start-subtitle{
    margin-top:10px;
    font-size:clamp(22px,4.5vw,34px);
    color:#dcecff;
}

.choice-row{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:35px;
}

.choice{
    min-width:105px;
    padding:14px 30px;
    border-radius:40px;
    font-size:19px;
    font-weight:700;
    color:#082052;
    background:#e8f3ff;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
    transition:.25s;
}

.choice:active{
    transform:scale(.92);
}

.no-message{
    min-height:28px;
    margin-top:18px;
    font-family:"Dancing Script",cursive;
    font-size:24px;
    color:#d8eaff;
}

/* =========================
   COUNTDOWN
========================= */

#timeScreen{
    background:
      radial-gradient(circle at center,rgba(85,150,240,.22),transparent 38%),
      linear-gradient(150deg,#03133b,#0b2c69,#04183f);
}

.count-number{
    font-size:clamp(80px,22vw,180px);
    font-weight:700;
    line-height:1;
    color:#e7f3ff;
    text-shadow:0 0 35px rgba(170,215,255,.45);
    animation:countPop .75s ease both;
}

@keyframes countPop{
    from{opacity:0;transform:scale(1.7)}
    to{opacity:1;transform:scale(1)}
}

.time-card{
    margin:auto;
    max-width:500px;
    padding:25px;
}

.time-label{
    font-size:15px;
    letter-spacing:5px;
    color:#9ec9ff;
}

.time-value{
    font-size:clamp(42px,10vw,75px);
    margin:5px 0 20px;
}

.fast-time{
    font-size:clamp(22px,6vw,40px);
    color:#dcecff;
    min-height:55px;
}

.years-message{
    margin-top:22px;
    font-size:26px;
    color:#dbeaff;
}

.now-23{
    margin-top:18px;
    font-family:"Dancing Script",cursive;
    font-size:clamp(48px,12vw,90px);
    color:white;
    text-shadow:0 0 25px rgba(170,220,255,.5);
}

.date-final{
    margin-top:15px;
    letter-spacing:5px;
    color:#a9d2ff;
    font-size:20px;
}

/* =========================
   HEARTS
========================= */

.heart-field{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.heart{

    width:15px;
    height:15px;
    background:#ff9db8;
    transform:rotate(45deg);
    opacity
