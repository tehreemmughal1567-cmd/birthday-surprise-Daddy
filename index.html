<!DOCTYPE html>
<html>
<head>
    <title>Daddy Birthday ❤️</title>
</head>
<body>

<h1>Happy Birthday Daddy 🥹❤️</h1>

<p>Welcome to your special surprise.</p>

</body
   <div>♾️</div> 
<div id="opening">🌸 For Daddy ❤️ 🌸</div>
<input id="password" type="password" placeholder="Enter Password">
   <button onclick="checkPassword()">Unlock</button> 
    <script>
function checkPassword() {
  const password = document.getElementById("password").value;

  if (password === "Infinity") {
    document.getElementById("opening").innerHTML = `
      <h1>Happy Birthday Daddy ❤️</h1>
      <button onclick="showSurprise()">💌 Open Your Surprise 💌</button>
    `;
  } else {
    alert("Wrong password 😭");
  }
}

function showSurprise() {
  document.getElementById("opening").innerHTML = `
    <h1>🎂 Happy Birthday Daddy ❤️</h1>

    <p>
      My love, this little surprise is just for you. 🥹❤️
      I love you more than words can explain.
      You are my favorite person and my happiest place. ❤️
    </p>

    <p>
      I hope your birthday is as beautiful and special as you are to me. 🎂✨
    </p>

    <button onclick="window.open('https://open.spotify.com/track/04y4lqZt14y7k7pXYE19Zy', '_blank')">
      🎵 Our Song
    </button>

    <br><br>

    <button onclick="showNextSurprise()">
      💖 Next Surprise
    </button>
  `;
}

function showNextSurprise() {
  document.getElementById("opening").innerHTML = `
    <h1>💌 One More Thing...</h1>
    <p>
      This is only the beginning of your little surprise. 🥹❤️
    </p>
  `;
}
</script>
    
    


</body>
</html>
