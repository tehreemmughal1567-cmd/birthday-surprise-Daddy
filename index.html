<!DOCTYPE html>
<html>
<head>
    <title>Daddy Birthday ❤️</title>
</head>
<body>

<h1>Happy Birthday Daddy 🥹❤️</h1>

<p>Welcome to your special surprise.</p>

</body
   <div>♾️</div> 
<div id="opening">🌸 For Daddy ❤️ 🌸</div>
<input id="password" type="password" placeholder="Enter Password">
   <button onclick="checkPassword()">Unlock</button> 
    <script>
function checkPassword() {
  const password = document.getElementById("password").value;
  if (password === "Infinity") {
    document.getElementById("opening").innerHTML = `
  <h1>Happy Birthday Daddy ❤️</h1>
  <button onclick="showSurprise()">💌 Open Your Surprise 💌</button>
`;
  } else {
      alert("Wrong password 😭");
  }
    function showSurprise() {
  document.getElementById("opening").innerHTML = `
    <h1>🎂 Happy Birthday Daddy ❤️</h1>
    <p>My love, this little surprise is just for you. 🥹❤️</p>
  `;
}
}
</script>
    
    


</body>
</html>
